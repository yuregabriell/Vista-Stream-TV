name: Vista Stream TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: vista-stream-main
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import pinned MIT sources
        run: bash scripts/vendor.sh
      - name: Adapt app identity
        run: python3 scripts/customize.py vendor/openstream
      - name: Commit vendored sources in this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A vendor/openstream vendor/goanime
          if ! git diff --cached --quiet; then
            git commit -m "Vendor OpenStream and GoAnime pinned sources"
            git push origin "HEAD:main"
          fi
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate runner Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          command -v sdkmanager || ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager
      - name: Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0" || sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build APK
        working-directory: vendor/openstream
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g"
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Select universal APK
        shell: bash
        run: |
          set -euo pipefail
          find vendor/openstream/app/build/outputs/apk -type f -name '*.apk'
          APK="$(find vendor/openstream/app/build/outputs/apk/debug -type f -name '*universal*.apk' -print -quit)"
          test -n "$APK" || { echo "No universal APK found" >&2; exit 1; }
          cp "$APK" "VistaStream-TV-${GITHUB_RUN_NUMBER}.apk"
      - name: Publish in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v0.2.0-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "VistaStream-TV-${GITHUB_RUN_NUMBER}.apk" \
            --target "${GITHUB_SHA}" --title "Vista Stream TV — $TAG" \
            --notes "Versão inicial baseada no OpenStream MIT com fonte GoAnime MIT vendorizada (ainda sem runtime Go). Repositórios OpenStream e Stremio configuráveis na app. APK de desenvolvimento assinado temporariamente; para atualizar poderá ser necessário desinstalar a build anterior." \
            --prerelease
