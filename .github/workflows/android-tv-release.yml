name: VistaStream APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: vista-stream-v2-release
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import pinned MIT sources
        run: bash scripts/vendor.sh
      - name: Adapt app identity
        run: python3 scripts/customize.py vendor/openstream
      - name: Commit vendored sources in this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A vendor/openstream vendor/goanime
          if ! git diff --cached --quiet; then
            git commit -m "Vendor OpenStream and GoAnime pinned sources"
            git push origin "HEAD:main"
          fi
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate runner Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          command -v sdkmanager || ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager
      - name: Android platform
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-37" "build-tools;36.0.0" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      # Required permanent signing secrets. Never publish temporary-signed APKs.
      # Store all four as private repository Actions secrets (never in git).
      - name: Prepare stable APK signing
        env:
          VISTA_SIGNING_KEYSTORE_BASE64: ${{ secrets.VISTA_SIGNING_KEYSTORE_BASE64 }}
          VISTA_KEYSTORE_PASSWORD: ${{ secrets.VISTA_KEYSTORE_PASSWORD }}
          VISTA_KEY_ALIAS: ${{ secrets.VISTA_KEY_ALIAS }}
          VISTA_KEY_PASSWORD: ${{ secrets.VISTA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in VISTA_SIGNING_KEYSTORE_BASE64 VISTA_KEYSTORE_PASSWORD VISTA_KEY_ALIAS VISTA_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing permanent APK signing secret: $name. Refusing to publish an unrepeatably signed build."
              exit 1
            fi
          done
          printf '%s' "$VISTA_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vista-signing.jks"
          chmod 600 "$RUNNER_TEMP/vista-signing.jks"
          keytool -list -keystore "$RUNNER_TEMP/vista-signing.jks" -storepass "$VISTA_KEYSTORE_PASSWORD" -alias "$VISTA_KEY_ALIAS" >/dev/null
          {
            echo "OPENSTREAM_KEYSTORE_PATH=$RUNNER_TEMP/vista-signing.jks"
            echo "OPENSTREAM_KEYSTORE_PASSWORD=$VISTA_KEYSTORE_PASSWORD"
            echo "OPENSTREAM_KEY_ALIAS=$VISTA_KEY_ALIAS"
            echo "OPENSTREAM_KEY_PASSWORD=$VISTA_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Verify Anime TV integration is fully wired
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('vendor/openstream/app/src/main/java/com/ivor/openstream')
          checks = [
            ('presentation/tv/TvChrome.kt', 'ANIME("tv_anime"'),
            ('presentation/tv/TvNavigation.kt', 'TvDestination.ANIME.route'),
            ('presentation/tv/TvNavigation.kt', 'TvAnimeScreen('),
            ('presentation/tv/TvHomeScreen.kt', 'onOpenAnime'),
            ('presentation/tv/TvSearchScreen.kt', 'Animes por género'),
            ('presentation/tv/TvSearchScreen.kt', 'onAnimeBrowse'),
            ('presentation/tv/TvAnimeScreen.kt', 'viewModel.browse("anime"'),
            ('presentation/tv/TvAnimeDetails.kt', 'onEpisode(ep.season, ep.number)'),
            ('presentation/catalog/KeylessCatalogScreen.kt', 'TvAnimeDetails('),
            ('data/catalog/KeylessCatalogClient.kt', 'https://graphql.anilist.co')
          ]
          for path,needle in checks:
            assert needle in (src/path).read_text(encoding='utf-8'), f'{path}: {needle}'
          print("Anime TV home, browse, genre search, native details and AniList connection verified.")
          PY
      - name: Build APK
        working-directory: vendor/openstream
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g"
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Test catalog, Cast, HLS and playback-engine diagnostics
        working-directory: vendor/openstream
        run: ./gradlew :app:testDebugUnitTest --tests '*OfficialCatalogTest' --tests '*CastByteRangesTest' --tests '*CastHlsSupportTest' --tests '*VistaPlaybackEngineTest' --no-daemon
      - name: Select universal APK
        shell: bash
        run: |
          set -euo pipefail
          find vendor/openstream/app/build/outputs/apk -type f -name '*.apk'
          APK="$(find vendor/openstream/app/build/outputs/apk/debug -type f -name '*universal*.apk' -print -quit)"
          test -n "$APK" || { echo "No universal APK found" >&2; exit 1; }
          cp "$APK" "VistaStream-${GITHUB_RUN_NUMBER}.apk"
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="VistaStream-${GITHUB_RUN_NUMBER}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          # Verify package name and monotonic build number before publishing.
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 1 | grep "name='com.vistastream.tv.debug'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 1 | grep "versionCode='${GITHUB_RUN_NUMBER}'"
      - name: Publish in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v0.17.0-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "VistaStream-${GITHUB_RUN_NUMBER}.apk" \
            --target "$(git rev-parse HEAD)" --title "VistaStream — $TAG" \
            --notes "VistaStream 0.17.0: sincronização opcional entre Android TV e telemóvel pela mesma rede Wi-Fi com código de emparelhamento, biblioteca cifrada, Continuar a assistir, catálogo guardado, histórico do player e reprodução de vídeos do navegador compatíveis; mantém o atualizador interno por GitHub Releases. Não é sincronização cloud automática. Fontes temporárias podem expirar. Mantém funcionalidades anteriores: interface premium de Animes dedicada para Android TV, separador Animes no menu e na Home, pesquisa de animes por nome e por género (Ação, Fantasia, Romance, Comédia, Drama, Ficção científica e outros), catálogo AniList paginado com recomendações, ecrã de detalhes TV adaptado para comando, temporadas, episódios e fontes de reprodução. Inclui também a primeira fase do Vista Playback Engine. Diagnóstico de fontes HTTP e formatos HLS, DASH, MP4, MKV e WebM; identificação prévia de streams sem extensão no player Android; verificação opcional do primeiro segmento HLS em mesma origem; identificação de páginas HTML/JSON e playlists inválidas no proxy Chromecast; erros Media3/Cast mais claros e troca automática limitada de fontes com prioridade a idioma e áudio. Inclui testes de regressão do motor de reprodução. Preserva a integração VistaLauncher 0.16.0, biblioteca, catálogo e atualizações. Algumas fontes e codecs poderão continuar incompatíveis." \
            --prerelease
