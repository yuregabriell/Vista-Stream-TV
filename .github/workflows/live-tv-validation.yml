name: VistaStream Live TV validation

on:
  pull_request:
    branches: [main]
    paths:
      - "vendor/openstream/**"
      - "web/**"
      - ".github/workflows/live-tv-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify web JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/live-tv.js
          node --check web/stremio.js
          node --test web/test-addons.mjs

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Locate runner Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          command -v sdkmanager || ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager
      - name: Install Android SDK platform
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Preserve local upstream and Vista identity
        run: |
          bash scripts/vendor.sh
          python3 scripts/customize.py vendor/openstream
          # API 37 is not yet published in the stable runner SDK index.
          # Verify the Kotlin/UI code against available API 36 without modifying repository sources.
          sed -i 's/compileSdk = 37/compileSdk = 36/' vendor/openstream/app/build.gradle.kts
      - name: Compile mobile and TV Kotlin (without publishing an APK)
        working-directory: vendor/openstream
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
