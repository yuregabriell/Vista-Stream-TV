name: Vista Stream Global Chromecast controls
on:
  workflow_dispatch:
  push:
    branches: [vista-global-cast-controls-v5]
permissions:
  contents: write
concurrency:
  group: vista-stream-v2-release
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import pinned MIT sources
        run: bash scripts/vendor.sh
      - name: Adapt app identity
        run: python3 scripts/customize.py vendor/openstream
      - name: Apply external Harvester receiving and editor
        run: |
          python3 scripts/enable_harvester_external.py
          test ! -e vendor/openstream/app/src/main/java/com/harvester/browser/MainActivity.java
          grep -q 'HarvesterImportActivity' vendor/openstream/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vendor/openstream/app/build.gradle.kts')
          s=p.read_text()
          assert 'versionCode = vistaBuild' in s
          s=s.replace('versionCode = vistaBuild','versionCode = 2400 + vistaBuild',1)
          s=s.replace('versionName = "0.2.0-build.$vistaBuild"',
                      'versionName = "0.7.0-cast.$vistaBuild"',1)
          p.write_text(s)
          print('Stand-alone Vista Stream player and metadata import; no embedded Harvester browser')
          PY
      - name: Apply explicit saves, catalog matching and episode source adapter
        run: |
          python3 scripts/curated_harvester_v2.py
          grep -q 'sourcesFor(identity)' vendor/openstream/app/src/main/java/com/ivor/openstream/data/streaming/StreamingRepositoryImpl.kt
          grep -q 'fun save(media: HarvesterMedia)' vendor/openstream/app/src/main/java/com/ivor/openstream/harvester/HarvesterLibraryStore.kt
          test ! -e vendor/openstream/app/src/main/java/com/harvester/browser/MainActivity.java
      - name: Match localized titles and suggest catalogue entries
        run: |
          python3 scripts/smart_title_matching_v3.py
          grep -q 'HarvesterTitleMatching.variants(query)' vendor/openstream/app/src/main/java/com/ivor/openstream/harvester/HarvesterImportActivity.kt
          grep -q 'lookup.performClick()' vendor/openstream/app/src/main/java/com/ivor/openstream/harvester/HarvesterImportActivity.kt
          grep -q 'Spider Man' vendor/openstream/app/src/main/java/com/ivor/openstream/harvester/HarvesterTitleMatching.kt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('vendor/openstream/app/src/main/java/com/ivor/openstream/harvester/HarvesterTitleMatching.kt').read_text()
          assert 'tokens.take(2)' in s
          assert 'spider man' in s.lower()
          assert 'take(4)' in s
          print('Title matcher checks passed.')
          PY
      - name: Use working Cinemeta AniList catalog and add Browser library
        run: |
          python3 scripts/vista_browser_keyless_v4.py
          grep -q 'KeylessCatalogClient' vendor/openstream/app/src/main/java/com/ivor/openstream/harvester/HarvesterImportActivity.kt
          grep -q 'lookup.performClick()' vendor/openstream/app/src/main/java/com/ivor/openstream/harvester/HarvesterImportActivity.kt
          grep -q 'item.matchedSourceId=="cinemeta:"' vendor/openstream/app/src/main/java/com/ivor/openstream/harvester/HarvesterLibraryStore.kt
          grep -q 'providerName = "Browser"' vendor/openstream/app/src/main/java/com/ivor/openstream/harvester/HarvesterLibraryStore.kt
          grep -q 'HarvesterShelf()' vendor/openstream/app/src/main/java/com/ivor/openstream/presentation/watch_later/WatchLaterScreen.kt
          test ! -e vendor/openstream/app/src/main/java/com/harvester/browser/MainActivity.java
      - name: Enable global Cast in Vista keyless player
        run: |
          python3 scripts/global_cast_player_v5.py
          python3 scripts/global_cast_home_v5.py
          grep -q 'rememberVistaCastSession()' vendor/openstream/app/src/main/java/com/ivor/openstream/presentation/catalog/VistaFullscreenPlayer.kt
          grep -q 'Em reprodução na TV' vendor/openstream/app/src/main/java/com/ivor/openstream/presentation/catalog/KeylessCatalogScreen.kt
          test -f vendor/openstream/app/src/main/java/com/ivor/openstream/presentation/player/components/VistaGlobalCast.kt
      - name: Skip vendoring commits (development branch)
        run: echo 'Using pinned version of Vista Stream source' 
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate runner Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          command -v sdkmanager || ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager
      - name: Android platform
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-37" "build-tools;36.0.0" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      # Optional: configure these four private repository Actions secrets once.
      # They must never be stored in the public repository or printed in logs.
      - name: Prepare stable APK signing
        env:
          VISTA_SIGNING_KEYSTORE_BASE64: ${{ secrets.VISTA_SIGNING_KEYSTORE_BASE64 }}
          VISTA_KEYSTORE_PASSWORD: ${{ secrets.VISTA_KEYSTORE_PASSWORD }}
          VISTA_KEY_ALIAS: ${{ secrets.VISTA_KEY_ALIAS }}
          VISTA_KEY_PASSWORD: ${{ secrets.VISTA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${VISTA_SIGNING_KEYSTORE_BASE64:-}" ]; then
            test -n "${VISTA_KEYSTORE_PASSWORD:-}"
            test -n "${VISTA_KEY_ALIAS:-}"
            test -n "${VISTA_KEY_PASSWORD:-}"
            printf '%s' "$VISTA_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vista-signing.jks"
            chmod 600 "$RUNNER_TEMP/vista-signing.jks"
            {
              echo "OPENSTREAM_KEYSTORE_PATH=$RUNNER_TEMP/vista-signing.jks"
              echo "OPENSTREAM_KEYSTORE_PASSWORD=$VISTA_KEYSTORE_PASSWORD"
              echo "OPENSTREAM_KEY_ALIAS=$VISTA_KEY_ALIAS"
              echo "OPENSTREAM_KEY_PASSWORD=$VISTA_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "No signing secret configured. Temporary debug signing: in-place updates may fail."
          fi
      - name: Build APK
        working-directory: vendor/openstream
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g"
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Select universal APK
        shell: bash
        run: |
          set -euo pipefail
          find vendor/openstream/app/build/outputs/apk -type f -name '*.apk'
          APK="$(find vendor/openstream/app/build/outputs/apk/debug -type f -name '*universal*.apk' -print -quit)"
          test -n "$APK" || { echo "No universal APK found" >&2; exit 1; }
          cp "$APK" "VistaStream-Global-Chromecast.apk"
      - name: Publish in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="vista-global-cast-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "VistaStream-Global-Chromecast.apk" \
            --target "$(git rev-parse HEAD)" --title "Vista Stream: Chromecast global, sessão TV e player — $TAG" \
            --notes "Ícone Chromecast global na página inicial. Ligação, seleção e desligação de dispositivos. O vídeo escolhido no catálogo ou Harvester usa a sessão Cast ligada, com fontes e legendas acessíveis no player. Em reprodução na TV abre os controlos. Ícone Cast substitui legenda duplicada no topo; legenda permanece em baixo. Mantém catálogos, Browser separado e biblioteca." \
            --prerelease
