name: Sign VistaBrowser 4.4.3 using protected VistaStream certificate
# Builds VistaBrowser 4.4.3 from its branch using the existing protected certificate.
on:
  push:
    branches: [feature/vistabrowser-central-signing-443]
    paths:
      - .github/workflows/vistabrowser-central-signing.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sign_vistabrowser:
    uses: yuregabrieldev/tiktok-feedback-helpers/.github/workflows/vistabrowser-v443-central-signer.yml@feature/vistabrowser-v443-longpress-media
    secrets:
      VB_KEYSTORE_BASE64: ${{ secrets.VISTA_SIGNING_KEYSTORE_BASE64 }}
      VB_KEYSTORE_PASSWORD: ${{ secrets.VISTA_KEYSTORE_PASSWORD }}
      VB_KEY_ALIAS: ${{ secrets.VISTA_KEY_ALIAS }}
      VB_KEY_PASSWORD: ${{ secrets.VISTA_KEY_PASSWORD }}
