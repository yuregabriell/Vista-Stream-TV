name: Sign VistaBrowser 4.4.2 using protected VistaStream certificate
# Re-run after repairing the 4.4.1 -> 4.4.2 sequential upgrade.
on:
  push:
    branches: [feature/vistabrowser-central-signing-442]
    paths:
      - .github/workflows/vistabrowser-central-signing.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sign_vistabrowser:
    uses: yuregabrieldev/tiktok-feedback-helpers/.github/workflows/vistabrowser-v442-central-signer.yml@feature/vistabrowser-v442-integrated-queue
    secrets:
      VB_KEYSTORE_BASE64: ${{ secrets.VISTA_SIGNING_KEYSTORE_BASE64 }}
      VB_KEYSTORE_PASSWORD: ${{ secrets.VISTA_KEYSTORE_PASSWORD }}
      VB_KEY_ALIAS: ${{ secrets.VISTA_KEY_ALIAS }}
      VB_KEY_PASSWORD: ${{ secrets.VISTA_KEY_PASSWORD }}
