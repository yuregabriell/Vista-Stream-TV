name: Sign VistaBrowser 4.4.1 using protected VistaStream certificate
on:
  push:
    branches: [feature/vistabrowser-central-signing]
    paths:
      - .github/workflows/vistabrowser-central-signing.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sign_vistabrowser:
    uses: yuregabrieldev/tiktok-feedback-helpers/.github/workflows/vistabrowser-v441-central-signer.yml@feature/vistabrowser-v441-permanent-signing
    secrets:
      VB_KEYSTORE_BASE64: ${{ secrets.VISTA_SIGNING_KEYSTORE_BASE64 }}
      VB_KEYSTORE_PASSWORD: ${{ secrets.VISTA_KEYSTORE_PASSWORD }}
      VB_KEY_ALIAS: ${{ secrets.VISTA_KEY_ALIAS }}
      VB_KEY_PASSWORD: ${{ secrets.VISTA_KEY_PASSWORD }}
