name: VistaStream Web — iPhone PWA
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/vistastream-web-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: vistastream-web-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate web app source
        run: |
          set -euo pipefail
          node --check web/app.js
          node --check web/sw.js
          python3 -m py_compile web/make_icons.py
          python3 web/make_icons.py
          test -s web/index.html
          test -s web/icons/icon-180.png
          test -s web/icons/icon-192.png
          test -s web/icons/icon-512.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("web/manifest.webmanifest").read_text())
          assert manifest["display"]=="standalone"
          assert manifest["start_url"].startswith("./")
          print("VistaStream Web PWA verified.")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - name: Publish public web app
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Package published web app
        run: |
          cd web
          zip -qr ../VistaStream-Web-iPhone.zip . -x '__pycache__/*'
      - name: Publish versioned Web release (does not replace Android APK latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vistastream-web-v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "VistaStream Web para iPhone — v0.1.${{ github.run_number }}"
          body: |
            VistaStream Web — aplicação web progressiva para Safari e iPhone.
            Abrir e instalar sem App Store: https://yuregabriell.github.io/Vista-Stream-TV/
            Interface responsiva, catálogo Cinemeta/AniList/TVmaze, biblioteca local, favoritos, progresso e importação de Vista Source manifest.json.
            É uma PWA: o ficheiro ZIP é apenas código web, não um IPA/APK. Os vídeos exigem fontes pessoais autorizadas e compatíveis com Safari. Vista ID cloud ainda não está integrado.
            Publicação web independente das releases APK do VistaStream Android.
          files: VistaStream-Web-iPhone.zip
          prerelease: true
          make_latest: false
