# Vista Stream optional metadata backend.
# Deploy with Render Blueprint. NO credentials are stored in this public file.
# TMDB/TVDB keys are supplied privately to the hosting provider.
services:
  - type: web
    name: vista-stream-metadata
    runtime: docker
    plan: free
    dockerfilePath: services/metadata-api/Dockerfile
    dockerContext: services/metadata-api
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: TMDB_API_KEY
        sync: false
      - key: VS_ACCESS_TOKENS
        generateValue: true
      # TVDB_API_KEY is configured only after license verification.
      - key: TVDB_LICENSED
        value: "false"
